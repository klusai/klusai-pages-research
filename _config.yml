title: KlusAI Research
description: >-
  Open privacy-focused models for European languages — benchmarks, datasets,
  models and papers from the KlusAI privacy program.
url: "https://research.klusai.com"
author:
  name: KlusAI
  email: research@klusai.com
lang: en

show_excerpts: true

# Self-contained custom layouts (assets/css/brand.css mirrors the klusai.com
# brand system) — no remote theme, so Pages builds without a Sass dependency.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Program-wide links reused across pages
klusai:
  flagship_hf: "https://huggingface.co/datasets/klusai/europriv-bench"
  github_org: "https://github.com/klusai"
  company: "https://klusai.com"

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - README.md
  - vendor/
