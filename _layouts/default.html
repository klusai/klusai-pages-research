<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/icon-only.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brand.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- feed_meta -%}
  {%- seo -%}
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-row">
      <a class="brand-lockup" href="{{ '/' | relative_url }}" aria-label="KlusAI Research home">
        <img class="logo-light" src="{{ '/assets/brand/logo-horizontal.svg' | relative_url }}" alt="KlusAI">
        <img class="logo-dark"  src="{{ '/assets/brand/logo-horizontal-white.svg' | relative_url }}" alt="KlusAI">
        <span class="brand-sub">Research</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/leaderboard/' | relative_url }}">Leaderboard</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="hide-sm" href="https://huggingface.co/klusai">Hugging&nbsp;Face</a>
        <a class="hide-sm" href="https://github.com/klusai">GitHub</a>
      </nav>
      <div class="nav-right">
        <a class="btn nav-cta" href="https://klusai.com">klusai.com&nbsp;↗</a>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      © {{ site.time | date: "%Y" }} KlusAI Labs SRL ·
      <a href="https://klusai.com">klusai.com</a> ·
      <a href="https://github.com/klusai">GitHub</a> ·
      <a href="https://huggingface.co/klusai">Hugging Face</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <div class="foot-tag">Applied Research · AI Services · Ventures</div>
    </div>
  </footer>
</body>
</html>
