<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/icon-only.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brand.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- feed_meta -%}
  {%- seo -%}
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-row">
      <a class="brand-lockup" href="{{ '/' | relative_url }}" aria-label="KlusAI Research home">
        <img class="logo-light" src="{{ '/assets/brand/logo-horizontal.svg' | relative_url }}" alt="KlusAI">
        <img class="logo-dark"  src="{{ '/assets/brand/logo-horizontal-white.svg' | relative_url }}" alt="KlusAI">
        <span class="brand-sub">Research</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-controls="nav-menu" aria-expanded="false">
        <svg class="i-bars" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <svg class="i-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="nav-menu" id="nav-menu">
        <nav class="site-nav">
          <a href="{{ '/leaderboard/' | relative_url }}">Leaderboard</a>
          <a href="{{ '/papers/' | relative_url }}">Papers</a>
          <a href="{{ '/roadmap/' | relative_url }}">Roadmap</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
        <div class="nav-right">
          <a class="btn nav-cta" href="https://klusai.com">klusai.com&nbsp;↗</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      © {{ site.time | date: "%Y" }} KlusAI Labs SRL ·
      <a href="https://klusai.com">klusai.com</a> ·
      <a href="https://github.com/klusai">GitHub</a> ·
      <a href="https://huggingface.co/klusai">Hugging Face</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <div class="foot-tag">EU-Sovereign AI Platform · Applied Research · Vertical Products</div>
    </div>
  </footer>
  <script>
    (function () {
      var btn = document.querySelector('.nav-toggle');
      if (!btn) return;
      var row = btn.closest('.nav-row');
      function setOpen(open) {
        row.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', function () { setOpen(!row.classList.contains('open')); });
      row.querySelectorAll('.nav-menu a').forEach(function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
  </script>
</body>
</html>
