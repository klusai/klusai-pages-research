# Shared bibliography for papers. Cite with {% include cite.html key="tab" %}.
# Each paper lists the keys it uses, in citation order, in its front-matter `cite_order`.
# `text` is the fully-formatted reference (inline HTML allowed: <em>, <code>, <a>).

tab:
  text: 'Pilán, Lison, Øvrelid, Papadopoulou, Sánchez, Batet. "The Text Anonymization Benchmark (TAB): A Dedicated Corpus and Evaluation Framework for Text Anonymization." <em>Computational Linguistics</em> 48(4), 2022. doi:10.1162/coli_a_00458.'

ai4privacy:
  text: 'AI4Privacy. "OpenPII Masking" datasets (CC-BY-4.0). Hugging Face, <code>ai4privacy/open-pii-masking-500k-ai4privacy</code>. Accessed June 2026.'

mapa:
  text: 'Ajausks et al. "The Multilingual Anonymisation Toolkit for Public Administrations (MAPA)." EAMT 2020; CEF Telecom project 2019-EU-IA-0045. Code: <code>github.com/MAPA-Consortium</code>; models on Hugging Face under <code>BSC-LT/</code>. Accessed June 2026.'

multigrascco:
  text: '"MultiGraSCCo: A Multilingual Anonymization Benchmark with Annotations of Personal Identifiers." 2026 preprint (German GraSCCo corpus machine-translated into further languages); builds on Modersohn et al., "GraSCCo," 2022. We were unable to resolve a stable DOI/arXiv locator at access time (June 2026).'

meddocan:
  text: 'Marimon et al. "MEDDOCAN: Medical Document Anonymization track (Spanish)." IberLEF, 2019.'

openai:
  text: 'OpenAI. "Privacy Filter" (<code>openai/privacy-filter</code>). Hugging Face, 2026. Accessed June 2026.'

openmed:
  text: 'OpenMed. "privacy-filter-multilingual" (<code>OpenMed/privacy-filter-multilingual</code>), 16 languages / 54 types. Hugging Face, 2026. Accessed June 2026.'

tabularisai:
  text: 'tabularisai. "eu-pii-safeguard" (<code>tabularisai/eu-pii-safeguard</code>), XLM-R, 26 EU languages. Hugging Face. Accessed June 2026.'

gliner:
  text: 'Zaratiana, Tomeh, Holat, Charnois. "GLiNER: Generalist Model for NER" (<code>urchade/gliner_multi_pii-v1</code>). 2023. arXiv:2311.08526.'

piiranha:
  text: 'iiiorg. "Piiranha-v1" (mDeBERTa-v3), license CC-BY-NC-ND-4.0. Hugging Face, 2024.'

ratbench:
  text: 'Krčo, Yao, Meeus, de Montjoye. "RAT-Bench: A Comprehensive Benchmark for Text Anonymization." 2026. arXiv:2602.12806. Concurrent, independent re-identification-risk leaderboard over synthetic text on U.S. demographics (English/Spanish/Chinese); no legal text, no GDPR-aligned taxonomy.'

gliner2pii:
  text: 'Zaratiana, Lewis, Hurn-Maloney. "GLiNER2-PII: A Multilingual Model for Personally Identifiable Information Extraction." 2026. arXiv:2605.09973. A 0.3B multilingual PII extractor over a 42-type taxonomy; a model, not a leaderboard.'

spy:
  text: 'Savkin, Ionov, Konovalov. "SPY: Enhancing Privacy with Synthetic PII Detection Dataset." NAACL 2025 (SRW), pp. 236–246. English-only synthetic PII benchmark with legal and clinical items.'

medprivbench:
  text: 'Guan, Zhai, Kwok, Du, Feng, Li, Qin, Hui. "MedPriv-Bench: Benchmarking the Privacy-Utility Trade-off of Large Language Models in Medical Open-End Question Answering." 2026. arXiv:2603.14265. Clinical-only LLM-QA privacy-utility benchmark.'

privacibench:
  text: 'Li, Hu, Jing, Chen, Hu, Han, Chu, Hu, Song. "PrivaCI-Bench: Evaluating Privacy with Contextual Integrity and Legal Compliance." ACL 2025. arXiv:2502.17041. Contextual-integrity / legal-compliance evaluation, not span-level de-identification.'

piibench:
  text: 'Jha. "PIIBench: A Unified Multi-Source Benchmark Corpus for Personally Identifiable Information Detection." 2026. arXiv:2604.15776. Consolidates ten public PII datasets for detection only.'

deusser:
  text: 'Deußer, Sparrenberg, Berger, Hahnbück, Bauckhage, Sifa. "A Survey on Current Trends and Recent Advances in Text Anonymization." IEEE DSAA 2025. arXiv:2508.21587. Flags the absence of a standardized multilingual de-identification benchmark.'
